# Deploy on the PUBLIC argus-releases repo as .github/workflows/fdroid-repo.yml
# Builds the own-F-Droid repo from the latest release APK and publishes it
# under docs/repo/ on main (Pages serves main/docs → repo URL is
# https://0x8e8fb-p.github.io/argus-releases/repo/).
name: F-Droid repo

on:
  schedule:
    - cron: '17 3 * * *'   # daily, off-peak
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fdroid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install fdroidserver
        run: pip install fdroidserver

      - name: Fetch latest APK
        run: |
          mkdir -p workdir/repo
          curl -sL -o workdir/repo/com.nexusblock.apk \
            https://github.com/0x8e8fb-p/argus-releases/releases/download/latest/argus.apk

      - name: fdroid init + update
        working-directory: workdir
        run: |
          fdroid init
          # init already wrote repo_url/repo_name defaults + keystore entries;
          # overwrite just the identity keys, keep the generated keystorepass.
          sed -i 's|^repo_url:.*|repo_url: https://0x8e8fb-p.github.io/argus-releases/repo|' config.yml
          sed -i 's|^repo_name:.*|repo_name: Argus Releases|' config.yml
          sed -i 's|^archive_url:.*|archive_url: https://0x8e8fb-p.github.io/argus-releases/repo/archive|' config.yml
          fdroid update --create-metadata

      - name: Publish repo into docs/repo (Pages path)
        run: |
          mkdir -p docs/repo
          rm -rf docs/repo/*
          cp -r workdir/repo/. docs/repo/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/repo
          git diff --cached --quiet && echo "No repo changes" && exit 0
          git commit -m "Update F-Droid repo index [skip ci]"
          git push
